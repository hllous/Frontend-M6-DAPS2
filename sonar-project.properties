# SonarCloud — análisis del Frontend (#923). Lo ejecuta el job `sonar` de .github/workflows/ci.yml
# con la cobertura combinada de los 4 shards de Vitest. El gate todavía no bloquea.
sonar.organization=hllous
sonar.projectKey=hllous_Frontend-M6-DAPS2
sonar.projectName=Frontend-M6-DAPS2

sonar.sources=src
sonar.tests=src,e2e
sonar.sourceEncoding=UTF-8

# Specs, utilidades de test y mocks de MSW cuentan como tests, no como código de producción:
# se analizan en busca de bugs y vulnerabilidades, pero no suman a cobertura ni duplicación.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**,src/mocks/**,e2e/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Componentes de shadcn idénticos a lo que genera el CLI (`shadcn add <nombre> --dry-run --view`,
# comparado con el registro base-nova). Los que el equipo modificó NO están acá: se analizan.
# La lista de cobertura repite `coverage.exclude` de vitest.config.ts.
sonar.coverage.exclusions=src/components/ui/card.tsx,src/components/ui/chart.tsx,src/components/ui/collapsible.tsx,src/components/ui/context-menu.tsx,src/components/ui/empty.tsx,src/components/ui/field.tsx,src/components/ui/input-group.tsx,src/components/ui/label.tsx,src/components/ui/separator.tsx,src/components/ui/toggle-group.tsx
sonar.cpd.exclusions=src/components/ui/card.tsx,src/components/ui/chart.tsx,src/components/ui/collapsible.tsx,src/components/ui/context-menu.tsx,src/components/ui/empty.tsx,src/components/ui/field.tsx,src/components/ui/input-group.tsx,src/components/ui/label.tsx,src/components/ui/separator.tsx,src/components/ui/toggle-group.tsx
