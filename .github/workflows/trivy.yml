# ──────────────────────────────────────────────────────────────
# Trivy — SCA, imagen y configuración del Frontend (#924, spec #922).
#
# Workflow propio para no tocar los shards de ci.yml. Pasadas: deps
# (pnpm-lock.yaml), fs (secretos), image (la imagen del Dockerfile) y config
# (Dockerfile). Cada una hace dos cosas:
#   1. REPORTE: SARIF a Code Scanning con HIGH/CRITICAL, incluidas las que
#      todavía no tienen fix (la cátedra pide "mitigación documentada", no
#      "ignoradas"). No falla nunca.
#   2. GATE: tabla en el log y falla con HIGH/CRITICAL que SÍ tengan fix
#      (ignore-unfixed solo acá). Las sin fix se documentan en .trivyignore.
#
# No está en la branch protection: el deploy lo hace Vercel por su
# integración y no este CI, así que el gate se ve como check rojo en el PR y
# se trata con el protocolo de hallazgos de hllous/Backend-M6-DAPS2#656.
# security-events: write solo en este job.
# trivy-action va fijada por SHA del commit (tag v0.36.0).
#
# Por qué deps no usa `trivy fs` sobre el lockfile: Trivy 0.70 lee solo 15
# paquetes de nuestro pnpm-lock.yaml (formato de pnpm 12) y deja pasar CVE
# conocidas sin avisar (verificado con lodash@4.17.20, CVE-2021-23337). Se
# genera un SBOM SPDX desde el lockfile con `pnpm sbom --prod` y se escanea
# con `scan-type: sbom`; el CycloneDX 1.7 de pnpm no lo decodifica Trivy.
# ──────────────────────────────────────────────────────────────

name: Trivy

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      # Los PRs de forks y de Dependabot reciben un token sin security-events:
      # ahí se corre el gate pero no se sube el SARIF.
      CAN_UPLOAD: ${{ !(github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: SBOM de dependencias de producción (desde pnpm-lock.yaml)
        run: pnpm sbom --sbom-format spdx --prod > sbom.spdx.json

      - name: Build de la imagen
        run: docker build -t m6-frontend:ci .

      # ── Reporte (SARIF, incluye las sin fix) ──
      - name: Reporte deps (SBOM del lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-deps.sarif
          exit-code: '0'

      - name: Reporte fs (secretos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: .cache,node_modules
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Reporte image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: m6-frontend:ci
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Reporte config (Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      - name: Subir deps a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

      - name: Subir fs a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Subir image a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Subir config a Code Scanning
        if: always() && env.CAN_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # ── Gate (HIGH/CRITICAL con fix) ──
      - name: Gate deps
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Gate fs (secretos)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: .cache,node_modules
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Gate image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: m6-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Gate config
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: table
          exit-code: '1'
