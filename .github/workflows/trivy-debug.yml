name: Trivy debug
on:
  push:
    branches: [infra/924-trivy-red-test]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-node-pnpm
      - name: variantes
        run: |
          pnpm sbom --sbom-format spdx --prod > sbom.spdx.json; echo exit $?
          head -c 500 sbom.spdx.json; echo
          trivy sbom --scanners vuln --severity HIGH,CRITICAL -f table sbom.spdx.json 2>&1 | grep -v "^$" | tail -20 | cut -c1-200
