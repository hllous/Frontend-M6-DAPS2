name: Trivy debug
on:
  push:
    branches: [infra/924-trivy-red-test]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-node-pnpm
      - name: variantes
        run: |
          mkdir d
          cp pnpm-lock.yaml package.json d/
          echo "=== d"
          trivy fs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL --include-dev-deps -f table d 2>&1 | grep -vE "^\s*$" | head -40
          echo "=== d json pkgs"
          trivy fs --scanners vuln --include-dev-deps --list-all-pkgs -f json d 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r['Target'],len(r.get('Packages',[])),len(r.get('Vulnerabilities',[]))) for r in d.get('Results',[])]"
          echo "=== d prod json"
          trivy fs --scanners vuln --list-all-pkgs -f json d 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('Results'))"
          echo "=== lodash in sbom"
          pnpm sbom --sbom-format cyclonedx --prod | grep -c '"name": "lodash"'
