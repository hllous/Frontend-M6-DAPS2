name: Trivy debug
on:
  push:
    branches: [infra/924-trivy-red-test]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
      - uses: ./.github/actions/setup-node-pnpm
      - name: variantes
        run: |
          mkdir d e
          cp pnpm-lock.yaml package.json d/
          echo "=== d (con package.json, dev deps)"
          trivy fs --scanners vuln --severity HIGH,CRITICAL --include-dev-deps -f table d 2>&1 | grep -E "Total|lodash|WARN|not found" | head -5
          echo "=== e (sbom)"
          pnpm --version
          pnpm sbom --sbom-format cyclonedx --prod > e/sbom.json 2> e/err.txt; echo exit $?; head -c 300 e/err.txt; ls -la e; head -c 400 e/sbom.json; echo
          trivy sbom --severity HIGH,CRITICAL -f table e/sbom.json 2>&1 | grep -E "Total|lodash|WARN|CVE-2021-23337|not found|FATAL" | head -8
