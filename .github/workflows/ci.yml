# ──────────────────────────────────────────────────────────────
# CI — Integración continua del frontend M6
# Se ejecuta en PRs y pushes a develop/test/main.
#
# IMPORTANTE: los jobs "build" y "test" mantienen sus nombres para
# preservar la convención de branch protection compartida con el
# backend. "e2e" y "security" son gates nuevos (#88): ninguno se
# ignora de forma permanente.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Smoke journeys, failure journeys, and axe/WCAG checks run against deterministic
      # mock scenarios and fixture data only — no production or Tier 2 data ever enters
      # these runs, so the traces/screenshots below carry none either.
      - name: Playwright smoke and accessibility suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
