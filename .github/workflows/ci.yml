# ──────────────────────────────────────────────────────────────
# CI — Integración continua del frontend M6
# Se ejecuta en PRs y pushes a develop/test/main.
#
# IMPORTANTE: los jobs "build" y "test" mantienen sus nombres para
# preservar la convención de branch protection compartida con el
# backend. "e2e" y "security" son gates nuevos (#88): ninguno se
# ignora de forma permanente. "docs" (#348) valida la documentación y
# es un check requerido una vez aplicadas las reglas de
# .github/branch-protection-rules.json; el backend no tiene un job
# "docs", así que los rule sets de ambos repos ahora difieren. El job
# no lleva filtro de paths: un check requerido sin reportar bloquea el merge.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect documentation-only pull request
        id: detect
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { isDocsOnlyChange } = require("./scripts/ci/docs-only.cjs");
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const [{ data: pull }, files] = await Promise.all([
              github.rest.pulls.get({ owner, repo, pull_number: pullNumber }),
              github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              }),
            ]);

            const docsOnly = isDocsOnlyChange({
              changedFiles: pull.changed_files,
              files,
            });

            core.setOutput("docs_only", String(docsOnly));
            core.info(`Documentation-only pull request: ${docsOnly}`);

  # Todos los jobs usan Ubuntu 24.04 para evitar la migración de ubuntu-latest a Ubuntu 26 el 2026-10-19.
  build:
    name: build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test

      - name: Documentation-only classifier tests
        run: node --test scripts/ci/docs-only.node-test.mjs

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: cache-playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # Smoke journeys, failure journeys, and axe/WCAG checks run against deterministic
      # mock scenarios and fixture data only — no production or Tier 2 data ever enters
      # these runs, so the traces/screenshots below carry none either.
      - name: Playwright smoke and accessibility suite
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    needs: [changes, e2e-shard]
    if: ${{ !cancelled() }}
    steps:
      - name: Require every Playwright shard to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ] && [ "$DOCS_ONLY" = "true" ]; then
            exit 0
          fi
          test "$SHARDS_RESULT" = "success"

  security:
    name: security
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --prod --audit-level=high

  docs:
    name: docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # markdownlint-cli2 0.23 exige Node 22+; todos los jobs usan Node 22.
      # Reglas y alcance en .markdownlint-cli2.jsonc.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Markdown lint
        run: pnpm dlx markdownlint-cli2@0.23.3

      # Versión y checksum fijados: se descarga un binario, no una action de terceros.
      # Reglas y alcance en lychee.toml (offline: solo enlaces y anclas internas).
      - name: Install lychee
        env:
          LYCHEE_TAG: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          asset=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_TAG}/${asset}" -o "${asset}"
          echo "${LYCHEE_SHA256}  ${asset}" | sha256sum --check
          tar -xzf "${asset}" --strip-components=1 "${asset%.tar.gz}/lychee"

      - name: Link check
        run: ./lychee --config lychee.toml '*.md' 'docs/**/*.md' '.github/*.md'
