# ──────────────────────────────────────────────────────────────
# CI — Integración continua del frontend M6
# Se ejecuta en PRs y pushes a develop/test/main.
#
# IMPORTANTE: los jobs se llaman "build" y "test" para mantener
# la misma convención que el backend y su branch protection.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Placeholder: todavía no hay framework de tests en el frontend.
      # Por ahora corre el linter. Cuando se sume Jest/Vitest, reemplazar.
      - name: Lint (placeholder de tests)
        run: npm run lint
