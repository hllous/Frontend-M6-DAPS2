# ──────────────────────────────────────────────────────────────
# CI — Integración continua del frontend M6
# Se ejecuta en PRs y pushes a develop/test/main.
#
# IMPORTANTE: los jobs "build" y "test" mantienen sus nombres para
# preservar la convención de branch protection compartida con el
# backend. "e2e" y "security" son gates nuevos (#88): ninguno se
# ignora de forma permanente. "docs" (#348) valida la documentación;
# no es un check requerido hasta agregarlo a branch protection.
# ──────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [develop, test, main]
  push:
    branches: [develop, test, main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Smoke journeys, failure journeys, and axe/WCAG checks run against deterministic
      # mock scenarios and fixture data only — no production or Tier 2 data ever enters
      # these runs, so the traces/screenshots below carry none either.
      - name: Playwright smoke and accessibility suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # markdownlint-cli2 0.23 exige Node 22+; el resto de los jobs usa Node 20.
      # Reglas y alcance en .markdownlint-cli2.jsonc.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.3

      # Versión y checksum fijados: se descarga un binario, no una action de terceros.
      # Reglas y alcance en lychee.toml (offline: solo enlaces y anclas internas).
      - name: Install lychee
        env:
          LYCHEE_TAG: lychee-v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          asset=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_TAG}/${asset}" -o "${asset}"
          echo "${LYCHEE_SHA256}  ${asset}" | sha256sum --check
          tar -xzf "${asset}" --strip-components=1 "${asset%.tar.gz}/lychee"

      - name: Link check
        run: ./lychee --config lychee.toml '*.md' 'docs/**/*.md' '.github/*.md'
